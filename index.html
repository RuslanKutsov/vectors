<style id="appcss">

.at .it,.ht .it{font:italic 600 15px var(--font-math)}

<div class="page"><div class="wrap">
<header class="bar">
  <div class="bar-row">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="#fbfcfe" stroke="#d3d9e8" stroke-width="2"/><g stroke="#d3d9e8" stroke-width="1"><path d="M16 8V56M32 8V56M48 8V56M8 16H56M8 32H56M8 48H56"/></g><g fill="none" stroke="#1b2a55" stroke-width="2.4" stroke-linecap="round"><path d="M8 52H56M12 56V8"/></g><g fill="none" stroke-width="3.4" stroke-linecap="round"><path d="M16 46 38 38" stroke="#0e7c78"/><path d="M38 38 44 18" stroke="#e8590c"/><path d="M16 46 44 18" stroke="#7048e8" stroke-dasharray="1 6"/></g><g><polygon points="41,36.5 33.5,35 36.5,41.5" fill="#0e7c78"/><polygon points="45,13.5 40,20.5 47.8,20" fill="#e8590c"/></g></svg>
      <div><a class="homelink" id="home" href="../"></a><h1 id="h1"></h1></div></div>

<main id="cards"></main>
</div></div>

<script>
/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
let lang='ru';
try{lang=localStorage.getItem('trainers.lang')==='en'?'en':'ru'}catch(e){}
const L=(ru,en)=>lang==='ru'?ru:en;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const sg=()=>Math.random()<.5?-1:1;
const hyp=(x,y)=>Math.hypot(x,y);
const isInt=v=>Math.abs(v-Math.round(v))<1e-9;
const eq=(p,q)=>p[0]===q[0]&&p[1]===q[1];
const V=n=>`<span class="v">${n}</span>`;
const fmt=x=>{let s=String(Math.round(x*100)/100).replace('-','−');return lang==='ru'?s.replace('.',','):s};
const pr=n=>n<0?`(${fmt(n)})`:fmt(n);
const vc=v=>`(${fmt(v[0])}; ${fmt(v[1])})`;
const rootTxt=n=>{const r=Math.sqrt(n);return isInt(r)?String(Math.round(r)):'√'+n};
const I=n=>`<i>${n}</i>`;
const SQ=x=>`<span class="sq"><svg class="rsv" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 12 L2.6 10.2 L5.2 18.6 L9.2 0.65 H10"/></svg><span class="rb">${x}</span></span>`;
const dotp=(a,b)=>a[0]*b[0]+a[1]*b[1];
const PY=[[3,4],[4,3],[6,8],[8,6],[5,12],[12,5]];
const DV={x0:-9,x1:11,y0:-6,y1:8};

const S={uid:0,root:null,task:0,stat:null,tried:false,counted:false,vecs:[],drawn:[],tool:'move',view:{...DV},cell:24,p:null,hint:false,drag:null,last:null};

function parse(s){
  s=String(s||'').trim();if(!s)return NaN;
  s=s.replace(/,/g,'.').replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/\^/g,'**')
     .replace(/√\s*\(/g,'sqrt(').replace(/√\s*([0-9.]+)/g,'sqrt($1)');
  s=s.replace(/(\d|\))\s*(sqrt|\()/g,'$1*$2').replace(/\)\s*(\d)/g,')*$1');
  if(!/^[0-9+\-*\/().\s]*$/.test(s.replace(/sqrt/g,'')))return NaN;
  try{const v=Function('sqrt','"use strict";return ('+s+')')(Math.sqrt);return typeof v==='number'?v:NaN}catch(e){return NaN}
}
function anyVec(m){let x,y;do{x=ri(-m,m);y=ri(-m,m)}while(!x&&!y);return[x,y]}
function intLenVec(mc){
  if(Math.random()<.25){const k=ri(1,Math.min(8,mc));return Math.random()<.5?[sg()*k,0]:[0,sg()*k]}
  const q=pick(PY.filter(t=>Math.max(t[0],t[1])<=mc));return[sg()*q[0],sg()*q[1]]}
function search(gen,ok,n){let r;for(let i=0;i<n;i++){r=gen();if(ok(r))return r}return r}
function mk(name,dx,dy,movable){return{name,col:'abc'.includes(name)?name:'r',dx,dy,tx:0,ty:0,movable:!!movable}}
const head=v=>[v.tx+v.dx,v.ty+v.dy];
function place(v,m){
  m=m===undefined?1:m;const w=S.view;
  let lx=Math.max(w.x0,w.x0-v.dx)+m,hx=Math.min(w.x1,w.x1-v.dx)-m,ly=Math.max(w.y0,w.y0-v.dy)+m,hy=Math.min(w.y1,w.y1-v.dy)-m;
  if(Math.ceil(lx)>Math.floor(hx))lx=hx=Math.round((lx+hx)/2);
  if(Math.ceil(ly)>Math.floor(hy))ly=hy=Math.round((ly+hy)/2);
  v.tx=ri(Math.ceil(lx),Math.floor(hx));v.ty=ri(Math.ceil(ly),Math.floor(hy));
}
function placeAll(vs,sep){
  sep=sep||4;
  for(let t=0;t<200;t++){
    vs.forEach(v=>place(v));let ok=true;
    for(let i=0;i<vs.length;i++)for(let j=i+1;j<vs.length;j++)
      if(Math.max(Math.abs(vs[i].tx-vs[j].tx),Math.abs(vs[i].ty-vs[j].ty))<sep)ok=false;
    if(ok)break;
  }
}
const fv=n=>S.vecs.find(v=>v.name===n);
const dvecs=()=>S.drawn.filter(d=>d.type==='vec');
const dlines=()=>S.drawn.filter(d=>d.type==='line');
const hasVec=(p,q)=>dvecs().some(d=>d.x1===p[0]&&d.y1===p[1]&&d.x2===q[0]&&d.y2===q[1]);
const hasLine=(p,q)=>dlines().some(d=>(d.x1===p[0]&&d.y1===p[1]&&d.x2===q[0]&&d.y2===q[1])||(d.x1===q[0]&&d.y1===q[1]&&d.x2===p[0]&&d.y2===p[1]));
function combTxt(co,names){
  let s='';co.forEach((c,j)=>{if(!c)return;const ab=Math.abs(c);const body=(ab===1?'':ab)+V(names[j]);
    if(!s)s=(c<0?'−':'')+body;else s+=(c<0?' − ':' + ')+body});return s}
const comb=(co,vs)=>[0,1].map(i=>co.reduce((s,c,j)=>s+c*vs[j][i],0));
const sub=(lbl)=>lbl; // placeholder

/* ---------- tasks ---------- */
const NOTE_SQRT=()=>L('Если ответ иррационален, запишите его с корнем (например, 5√3 или √5) или десятичной дробью с точностью до 0,01. Кнопка √ вставляет знак корня.','If the answer is irrational, write it with a root (e.g. 5√3 or √5) or as a decimal to 0.01. The √ button inserts the root sign.');

/* ---- label placement (no overlaps) ---- */
function segHit(g,r){
  const n=Math.max(2,Math.ceil(Math.hypot(g[2]-g[0],g[3]-g[1])/3));
  for(let i=0;i<=n;i++){const x=g[0]+(g[2]-g[0])*i/n,y=g[1]+(g[3]-g[1])*i/n;if(x>=r[0]-2&&x<=r[2]+2&&y>=r[1]-2&&y<=r[3]+2)return true}
  return false;
}
function fit(ctx,cands,w,h){
  let best=null,bs=1e9;
  const score=(c,i)=>{
    const r=[c[0]-w/2,c[1]-h/2,c[0]+w/2,c[1]+h/2];let sc=i;
    if(r[0]<3||r[1]<3||r[2]>ctx.W-3||r[3]>ctx.H-3)sc+=1e4;
    ctx.rects.forEach(o=>{if(r[0]<o[2]+2&&r[2]>o[0]-2&&r[1]<o[3]+2&&r[3]>o[1]-2)sc+=1e3});
    ctx.segs.forEach(g=>{if(segHit(g,r))sc+=300});
    if(sc<bs){bs=sc;best={x:c[0],y:c[1],r}}
  };
  cands.forEach((c,i)=>score(c,i*.4));
  if(bs>=300&&cands.length){ // fallback: scan the neighbourhood of the preferred spot
    const c0=cands[0];
    for(let dx=-130;dx<=130;dx+=6)for(let dy=-110;dy<=110;dy+=6)
      score([c0[0]+dx,c0[1]+dy],Math.hypot(dx,dy)*.03);
  }
  ctx.rects.push(best.r);return best;
}
function sideCands(p,q,w,h){
  const out=[],dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  const up=(ny<0||(ny===0&&nx<0))?1:-1;
  [.5,.35,.65,.2,.8].forEach(t=>[up,-up].forEach(sd=>[0,8,16].forEach(ex=>{
    const dd=4+Math.abs(nx)*w/2+Math.abs(ny)*h/2+ex;
    out.push([p[0]+dx*t+sd*nx*dd,p[1]+dy*t+sd*ny*dd]);
  })));
  return out;
}
function projSvg(v){return (X,Y,c,ctx)=>{
  const x1=v.tx,y1=v.ty,x2=v.tx+v.dx,y2=v.ty+v.dy;
  const dl=(a,b,e,f)=>{ctx.segs.push([X(a),Y(b),X(e),Y(f)]);return `<line class="hd" x1="${X(a)}" y1="${Y(b)}" x2="${X(e)}" y2="${Y(f)}"/>`};
  const seg=(a,b,e,f)=>`<line class="hl" x1="${X(a)}" y1="${Y(b)}" x2="${X(e)}" y2="${Y(f)}"/>`;
  let o=dl(x1,y1,x1,0)+dl(x2,y2,x2,0)+dl(x1,y1,0,y1)+dl(x2,y2,0,y2);

function g2(){
  S.view={x0:-8,x1:8,y0:-6,y1:6};
  const ang=pick([30,45,60]),fromX=Math.random()<.5,qx=sg(),qy=sg();
  let m,mTxt,along,perp,alT,peT;
  let mH;
  if(ang===45){const k=ri(2,8);m=k*Math.SQRT2;mTxt=k+'√2';mH=k+SQ('2');along=perp=k;alT=peT=String(k)}
  else{m=2*ri(2,6);mTxt=String(m);mH=mTxt;const h=m/2;
    if(ang===30){along=h*Math.sqrt(3);alT=h+'√3';perp=h;peT=String(h)}else{along=h;alT=String(h);perp=h*Math.sqrt(3);peT=h+'√3'}}
  const dx=fromX?qx*along:qx*perp,dy=fromX?qy*perp:qy*along;
  const dxT=(qx<0?'−':'')+(fromX?alT:peT),dyT=(qy<0?'−':'')+(fromX?peT:alT);

    extra:(X,Y,c,ctx)=>{
      const o=[X(0),Y(0)],r=1.8*c;

      let df=f1-f0;while(df>Math.PI)df-=2*Math.PI;while(df<=-Math.PI)df+=2*Math.PI;
      const pt=(f,rr)=>[o[0]+rr*Math.cos(f),o[1]-rr*Math.sin(f)];
      const A=pt(f0,r),B=pt(f1,r);
      const hx=X(v.dx),hy=Y(v.dy);
      ctx.segs.push([hx,hy,hx,o[1]],[hx,hy,o[0],hy]);
      let prev=A;for(let i=1;i<=12;i++){const q=pt(f0+df*i/12,r);ctx.segs.push([prev[0],prev[1],q[0],q[1]]);prev=q}
      let out=`<line class="gd" x1="${hx}" y1="${hy}" x2="${hx}" y2="${o[1]}"/><line class="gd" x1="${hx}" y1="${hy}" x2="${o[0]}" y2="${hy}"/>`+
        `<path class="arc" d="M${A[0]} ${A[1]} A${r} ${r} 0 0 ${df>0?0:1} ${B[0]} ${B[1]}"/>`;
      /* candidates for the angle value: ring around the arc, nearest to the arc first */

      for(let k=1.4;k<=3.4;k+=.1)for(let d=-(half+.9);d<=half+.9;d+=.07)
        cl.push({p:pt(mid+d,r*k),cost:(k-1.4)*r*1.6+Math.abs(d)*r*.22+(Math.abs(d)>half?6:0)});
      cl.sort((u,v)=>u.cost-v.cost);

function g10(){

    S.view={x0:-1,x1:13,y0:-1,y1:11};
    const a=anyVec(6),b=anyVec(6);const va=mk('a',a[0],a[1],false),vb=mk('b',b[0],b[1],false);placeAll([va,vb],2);S.vecs=[va,vb];

      text:()=>L(`Найдите скалярное произведение векторов ${V('a')} и ${V('b')} (см. рисунок).`,`Find the dot product of vectors ${V('a')} and ${V('b')} (see figure).`),
      fields:[{id:'d',label:[V('a')+'·'+V('b')+' =',V('a')+'·'+V('b')+' ='],ans:dotp(a,b)}],

    const va=mk('a',a[0],a[1],false),vb=mk('b',b[0],b[1],false);placeAll([va,vb],3);S.vecs=[va,vb];const cs=d/(la*lb);
    return{mode:'axes',tools:null,
      text:()=>L(`На координатной плоскости изображены векторы ${V('a')} и ${V('b')}. Найдите косинус угла между ними.<div class="note">Ответ — обыкновенная или десятичная дробь (с точностью до 0,01).</div>`,`Vectors ${V('a')} and ${V('b')} are drawn on the coordinate plane. Find the cosine of the angle between them.<div class="note">Give a fraction or a decimal (to 0.01).</div>`),
      fields:[{id:'c',label:['cos φ =','cos φ ='],ans:cs,tol:.006}],
      sol:()=>`${V('a')} = ${vc(a)}, ${V('b')} = ${vc(b)}; cos φ = ${fmt(d)} / (${fmt(la)}·${fmt(lb)}) = ${fmt(cs)}`};
  }
  const [a,b,p,q,r]=search(()=>{const a=anyVec(4),b=anyVec(4),p=pick([-3,-2,-1,1,2,3]),q=pick([-3,-2,-1,1,2,3]);return[a,b,p,q,comb([p,q],[a,b])]},
    z=>(z[0][0]*z[1][1]-z[0][1]*z[1][0]!==0)&&(z[4][0]||z[4][1])&&isInt(hyp(z[4][0],z[4][1])),20000);
  const va=mk('a',a[0],a[1],false),vb=mk('b',b[0],b[1],false);placeAll([va,vb],3);S.vecs=[va,vb];
  const ex=()=>combTxt([p,q],['a','b']),ln=hyp(r[0],r[1]);
  if(kind==='len')return{mode:'axes',tools:null,
    text:()=>L(`На координатной плоскости изображены векторы ${V('a')} и ${V('b')}. Найдите длину вектора <span class="nb">${ex()}</span>.`,`Vectors ${V('a')} and ${V('b')} are drawn on the coordinate plane. Find the length of <span class="nb">${ex()}</span>.`),
    fields:[{id:'l',label:['Длина','Length'],ans:ln}],
    sol:()=>`${V('a')} = ${vc(a)}, ${V('b')} = ${vc(b)};&nbsp; ${comb([p,q],['a','b']).length?'':''}${L('вектор','vector')} = ${vc(r)};&nbsp; ${L('длина','length')} = ${fmt(ln)}`};
  return{mode:'axes',tools:null,

    sol:()=>`${V('a')} = ${vc(a)}, ${V('b')} = ${vc(b)};&nbsp; ${vc(r)};&nbsp; ${L('длина','length')} = ${fmt(ln)}`};

function g11(){

    if(kind==='text_len')vs=[anyVec(18),anyVec(18),anyVec(18)];else vs=[anyVec(8),anyVec(8),anyVec(8)];
  }else{vs=[anyVec(4),anyVec(4),anyVec(4)]}

  const fig=()=>L(`На координатной плоскости изображены векторы ${V('a')}, ${V('b')} и ${V('c')}.`,`Vectors ${V('a')}, ${V('b')} and ${V('c')} are drawn on the coordinate plane.`);
  if(kind==='text_len'||kind==='grid_len'){
    const big=kind==='text_len';
    const res=search(()=>{const v=big?[anyVec(big?18:4),anyVec(18),anyVec(18)]:[anyVec(4),anyVec(4),anyVec(4)];
        const c=[0,0,0].map(()=>ri(-5,5)||1);return[v,c,comb(c,v)]},
      z=>(z[2][0]||z[2][1])&&isInt(hyp(z[2][0],z[2][1]))&&hyp(z[2][0],z[2][1])<=60&&z[1].some(x=>Math.abs(x)>1),30000);
    vs=res[0];co=res[1];r=res[2];const ln=hyp(r[0],r[1]);
    fields=[{id:'l',label:['Длина','Length'],ans:ln}];
    tx=()=>(text?give():fig())+L(` Найдите длину вектора <span class="nb">${combTxt(co,nm)}</span>.`,` Find the length of <span class="nb">${combTxt(co,nm)}</span>.`);
    sol=()=>`${vc(r)};&nbsp; ${L('длина','length')} = ${fmt(ln)}`;
  }else if(kind==='grid_proj'){
    const res=search(()=>{const c=[0,0,0].map(()=>pick([-2,-1,1,2]));return[c,comb(c,vs)]},z=>z[1][0]||z[1][1],200);
    co=res[0];r=res[1];
    fields=[{id:'x',label:['проекция на ось <i>x</i>','projection on the <i>x</i>-axis'],ans:r[0]},{id:'y',label:['проекция на ось <i>y</i>','projection on the <i>y</i>-axis'],ans:r[1]}];
    tx=()=>fig()+L(` Найдите проекции вектора <span class="nb">${combTxt(co,nm)}</span> на оси координат.`,` Find the projections of <span class="nb">${combTxt(co,nm)}</span> on the axes.`);
    sol=()=>`${V('a')} = ${vc(vs[0])}, ${V('b')} = ${vc(vs[1])}, ${V('c')} = ${vc(vs[2])};&nbsp; ${vc(r)}`;
  }else{
    // dot product of two combinations
    const res=search(()=>{
      const u=[0,0,0],w=[0,0,0];const i=ri(0,2);let j;do{j=ri(0,2)}while(j===i);
      u[i]=sg();if(Math.random()<.6)u[j]=sg();
      const k=ri(0,2);w[k]=sg();if(Math.random()<.3){let l;do{l=ri(0,2)}while(l===k);w[l]=sg()}
      return[u,w]},z=>!eq(z[0],z[1])&&[0,1,2].every(i=>z[0][i]||z[1][i]),3000);
    const u=res[0],w=res[1],U=comb(u,vs),W=comb(w,vs);
    const wrap=co2=>{const nz=co2.filter(x=>x);return(nz.length>1||nz[0]<0)?`(${combTxt(co2,nm)})`:combTxt(co2,nm)};

    tx=()=>(text?give():fig())+L(` Найдите значение выражения <span class="nb">${wrap(u)}·${wrap(w)}</span>.`,` Find the value of <span class="nb">${wrap(u)}·${wrap(w)}</span>.`);
    sol=()=>`${L('Первый множитель','First factor')} ${vc(U)}, ${L('второй','second')} ${vc(W)};&nbsp; ${pr(U[0])}·${pr(W[0])} + ${pr(U[1])}·${pr(W[1])} = ${fmt(d)}`;
  }

  return{mode:'axes',tools:null,noFig:text,text:tx,fields,sol};
}

/* ---------- rendering ---------- */
function vlab(cx,cy,t,k){
  return `<text class="vn k-${k}" x="${cx}" y="${cy+10}" text-anchor="middle">${t}</text><path class="va k-${k}" d="M${cx-5} ${cy-7}h10m-3 -2.5l3 2.5l-3 2.5"/>`;
}
const neg=x=>x<0?'−'+(-x):String(x);

  const box=Q('.fig');if(!box||!S.p)return;
  const p=S.p,w=S.view,c=S.cell,W=(w.x1-w.x0)*c,H=(w.y1-w.y0)*c;

  S.drawn.forEach(d=>s+=dr(d,false));

function drawRadBars(root){
  const c2=document.createElement('canvas').getContext('2d');
  root.querySelectorAll('tspan.rr').forEach(t=>{
    try{const tx=t.parentNode,cs=getComputedStyle(tx);
      c2.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const asc=c2.measureText('√').actualBoundingBoxAscent,bb=t.getBBox(),base=+tx.getAttribute('y');
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('class','rbar');ln.setAttribute('x1',bb.x-.5);ln.setAttribute('x2',bb.x+bb.width+.5);
      ln.setAttribute('y1',base-asc+.8);ln.setAttribute('y2',base-asc+.8);t.ownerSVGElement.appendChild(ln)}catch(e){}
  });
}
/* ---------- cards: several tasks on one tab, each with its own state ---------- */
const CF=['uid','task','vecs','drawn','tool','view','p','hint','counted','tried','assisted','drag','last','root'];
function wc(c,fn){ /* run fn with card c loaded into S, then store it back */
  const prev={};CF.forEach(k=>prev[k]=S[k]);CF.forEach(k=>S[k]=c[k]);

    if(best)S.drag={kind:'move',v:best,ox:q.x-best.tx,oy:q.y-best.ty};
  }else if(S.tool==='erase'){
    let bi=-1,bd=.5;
    S.drawn.forEach((d,i)=>{const dd=dseg(q.x,q.y,d.x1,d.y1,d.x2,d.y2);if(dd<bd){bd=dd;bi=i}});

  render();
}
function ptrMove(e){
  if(!S.drag)return;const q=gp(e),w=S.view;
  if(S.drag.kind==='move'){
    const v=S.drag.v;let nx=Math.round(q.x-S.drag.ox),ny=Math.round(q.y-S.drag.oy);
    nx=Math.min(Math.max(nx,Math.max(w.x0,w.x0-v.dx)),Math.min(w.x1,w.x1-v.dx));
    ny=Math.min(Math.max(ny,Math.max(w.y0,w.y0-v.dy)),Math.min(w.y1,w.y1-v.dy));

}

async function fontCss(){

  try{
    const link=document.querySelector('link[href*="fonts.googleapis.com/css"]');if(!link)return FONTCSS;
    const css=await (await fetch(link.href)).text();
    const re=/\/\*\s*([a-z-]+)\s*\*\/\s*(@font-face\s*\{[^}]*\})/g,blocks=[];let m;
    while((m=re.exec(css)))if(m[1]==='cyrillic'||m[1]==='latin')blocks.push(m[2]);
    const b64=buf=>{let t='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
    const done=await Promise.all(blocks.map(async b=>{const u=/url\((https:[^)]+)\)/.exec(b);if(!u)return '';const buf=await (await fetch(u[1])).arrayBuffer();return b.replace(u[0],'url(data:font/woff2;base64,'+b64(buf)+')')}));

async function pageCanvases(items){
  const W=1240,H=1754,M=70,TW=W-2*M,FONT="'IBM Plex Sans','Noto Sans','DejaVu Sans',Arial,sans-serif",pages=[],hdr=REPT().hdr;
  let cv,ctx,y;
  const newPage=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#5b6978';ctx.font='500 20px '+FONT;ctx.textBaseline='top';ctx.fillText(hdr,M,M-34);y=M+14;pages.push(cv)};
  newPage();
  for(const it of items){
    const im=await loadImg(svgDoc(it));
    let tw=Math.min(TW,it.w*1.6),th=it.h*tw/it.w;const room=H-2*M-14;
    if(th>room){tw=tw*room/th;th=room}

}
function pdfFromCanvases(cvs){

  cvs.forEach((cv,i)=>{
    const jpg=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]),img=new Uint8Array(jpg.length);
    for(let j=0;j<jpg.length;j++)img[j]=jpg.charCodeAt(j);
    const ph=+(cv.height*pw/cv.width).toFixed(2),pg=3+i*3,cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Contents '+(pg+1)+' 0 R /Resources << /XObject << /Im0 '+(pg+2)+' 0 R >> >> >>');
    obj(pg+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[pg+2]=pos;push((pg+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n');push(img);push('\nendstream\nendobj\n');
  });

}

   '\nbody{margin:0 auto;max-width:1040px;padding:24px 16px;background:#fff;color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}h1.rh{font-size:20px;color:var(--muted);font-weight:500;margin:0 0 18px}section{margin:0 0 26px;break-inside:avoid}.snap{padding:0}</style></head><body><h1 class="rh">'+R.hdr+'</h1>'+items.map(sec).join('')+'</body></html>';
}
async function doSave(kind){
  if(!report.length)return;
  const bt=$(kind==='html'?'save-html':'save-pdf');bt.disabled=true;await fontCss();
  try{
    if(kind==='html')await saveFile('vector_tasks.html',htmlFromItems(report),'text/html');
    else{const pdf=pdfFromCanvases(await pageCanvases(report));window.__pdf=pdf;await saveFile('vector_tasks.pdf',pdf,'application/pdf')}
  }catch(e){if(!e||e.code!=='declined')$('rep-count').textContent=REPT().fail}
  repUI();
}
$('save-pdf').addEventListener('click',()=>doSave('pdf'));
$('save-html').addEventListener('click',()=>doSave('html'));
$('rep-clear').addEventListener('click',()=>{report=[];repSave();repUI()});
S.stat=loadStat();
initEvents();
document.documentElement.lang=lang;
{let g0=0;try{g0=+localStorage.getItem('vectors.tab')||0}catch(e){}if(!(g0>=0&&g0<GROUPS.length))g0=0;showGroup(g0)}
</script>
